[project]
name = "mnist-case-study"
version = "1.0.0"
description = "MLP vs CNN on MNIST: accuracy, paired significance, calibration, translation robustness and an error-budget decision rule."
readme = "README.md"
license = "MIT"
authors = [{ name = "Pierre Chambet" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "tensorflow>=2.16",
]

[project.scripts]
mnist-study = "mnist_study.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.build-backend]
module-name = "mnist_study"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]
