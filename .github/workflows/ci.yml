name: CI (minimal smoke)

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dev tools (ruff)
        run: pip install -r requirements-dev.txt

      - name: Compile all Python files (no heavy deps)
        run: python -m compileall -q .

      - name: Ruff lint (py files only)
        run: ruff check --exclude "*.ipynb" .

      - name: Summary
        run: |
          echo "Minimal CI passed: syntax OK."
